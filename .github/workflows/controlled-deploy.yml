name: Controlled Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      component:
        description: Deploy scope
        required: true
        default: frontend
        type: choice
        options:
          - frontend
          - backend
          - detectors
          - workers
          - all
      backend_image:
        description: Optional backend image override for backend/all deploys
        required: false
        type: string
      dry_run:
        description: Validate the deploy plan without authenticating or deploying
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'deploy-dev-frontend-*'
      - 'deploy-dev-backend-*'
      - 'deploy-dev-detectors-*'
      - 'deploy-dev-workers-*'
      - 'deploy-dev-all-*'
      - 'deploy-prod-frontend-*'
      - 'deploy-prod-backend-*'
      - 'deploy-prod-detectors-*'
      - 'deploy-prod-workers-*'
      - 'deploy-prod-all-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: controlled-deploy-global
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      deploy_environment: ${{ steps.resolve.outputs.deploy_environment }}
      component: ${{ steps.resolve.outputs.component }}
      backend_image: ${{ steps.resolve.outputs.backend_image }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
    steps:
      - name: Resolve deploy request
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment || '' }}
          INPUT_COMPONENT: ${{ github.event.inputs.component || '' }}
          INPUT_BACKEND_IMAGE: ${{ github.event.inputs.backend_image || '' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          deploy_environment=""
          component=""
          backend_image=""
          dry_run="false"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            deploy_environment="$INPUT_ENVIRONMENT"
            component="$INPUT_COMPONENT"
            backend_image="$INPUT_BACKEND_IMAGE"
            dry_run="${INPUT_DRY_RUN,,}"
          else
            if [[ ! "$REF_NAME" =~ ^deploy-(dev|prod)-(frontend|backend|detectors|workers|all)-((dryrun)-)?(.+)$ ]]; then
              echo "Unsupported deploy tag: ${REF_NAME}" >&2
              exit 1
            fi
            deploy_environment="${BASH_REMATCH[1]}"
            component="${BASH_REMATCH[2]}"
            if [[ -n "${BASH_REMATCH[4]}" ]]; then
              dry_run="true"
            fi
          fi

          case "$deploy_environment" in
            dev|prod) ;;
            *)
              echo "Unsupported deploy environment: ${deploy_environment}" >&2
              exit 1
              ;;
          esac

          case "$component" in
            frontend|backend|detectors|workers|all) ;;
            *)
              echo "Unsupported deploy component: ${component}" >&2
              exit 1
              ;;
          esac

          if [[ -n "$backend_image" && "$component" != "backend" && "$component" != "all" ]]; then
            echo "backend_image is only supported for component=backend|all." >&2
            exit 1
          fi

          github_environment="development"
          if [[ "$deploy_environment" == "prod" ]]; then
            github_environment="production"
          fi

          {
            echo "deploy_environment=${deploy_environment}"
            echo "component=${component}"
            echo "backend_image=${backend_image}"
            echo "dry_run=${dry_run}"
            echo "github_environment=${github_environment}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: resolve
    environment: ${{ needs.resolve.outputs.github_environment }}
    timeout-minutes: 60
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.deploy_environment }}
      DEPLOY_COMPONENT: ${{ needs.resolve.outputs.component }}
      BACKEND_IMAGE: ${{ needs.resolve.outputs.backend_image }}
      DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
      DEPLOY_WIF_PROVIDER: ${{ needs.resolve.outputs.deploy_environment == 'prod' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
      DEPLOY_SERVICE_ACCOUNT: ${{ needs.resolve.outputs.deploy_environment == 'prod' && secrets.GCP_SERVICE_ACCOUNT_PROD || secrets.GCP_SERVICE_ACCOUNT_DEV }}
      DEPLOY_CREDENTIALS_JSON: ${{ needs.resolve.outputs.deploy_environment == 'prod' && secrets.GCP_CREDENTIALS_JSON_PROD || secrets.GCP_CREDENTIALS_JSON_DEV }}
      DEPLOY_BACKEND_ENV_B64: ${{ needs.resolve.outputs.deploy_environment == 'prod' && secrets.BACKEND_ENV_FILE_B64_PROD || secrets.BACKEND_ENV_FILE_B64_DEV }}
      DEPLOY_FRONTEND_OVERRIDE_B64: ${{ needs.resolve.outputs.deploy_environment == 'prod' && secrets.FRONTEND_ENV_OVERRIDE_B64_PROD || secrets.FRONTEND_ENV_OVERRIDE_B64_DEV }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install root dependencies
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_COMPONENT" != "frontend" && "$DEPLOY_COMPONENT" != "all" ]]; then
            echo "Root frontend dependencies are not needed for component=${DEPLOY_COMPONENT}."
            exit 0
          fi
          npm ci

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_COMPONENT" != "frontend" && "$DEPLOY_COMPONENT" != "all" ]]; then
            echo "Frontend package install is not needed for component=${DEPLOY_COMPONENT}."
            exit 0
          fi
          npm --prefix frontend ci

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_COMPONENT" != "backend" && "$DEPLOY_COMPONENT" != "all" ]]; then
            echo "Backend Python dependencies are not needed for component=${DEPLOY_COMPONENT}."
            exit 0
          fi
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.DEPLOY_WIF_PROVIDER != '' && env.DEPLOY_SERVICE_ACCOUNT != '' && env.DEPLOY_WIF_PROVIDER || '' }}
          service_account: ${{ env.DEPLOY_WIF_PROVIDER != '' && env.DEPLOY_SERVICE_ACCOUNT != '' && env.DEPLOY_SERVICE_ACCOUNT || '' }}
          credentials_json: ${{ ((env.DEPLOY_WIF_PROVIDER == '' || env.DEPLOY_SERVICE_ACCOUNT == '') && env.DEPLOY_CREDENTIALS_JSON) || '' }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify deploy auth exists
        run: |
          set -euo pipefail
          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          if [[ -z "$active_account" ]]; then
            echo "Missing Google Cloud auth. Configure WIF or service-account key secrets for this environment." >&2
            exit 1
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run validated deploy auth as ${active_account}."
          else
            echo "Authenticated as ${active_account}"
          fi

      - name: Seed ADC for runner-side backend preflight checks
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_COMPONENT" != "backend" && "$DEPLOY_COMPONENT" != "all" ]]; then
            echo "Runner ADC is not required for component=${DEPLOY_COMPONENT}."
            exit 0
          fi

          creds_source=""
          for candidate in \
            "${GOOGLE_GHA_CREDS_PATH:-}" \
            "${GOOGLE_APPLICATION_CREDENTIALS:-}" \
            "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}"
          do
            if [[ -n "$candidate" && -f "$candidate" ]]; then
              creds_source="$candidate"
              break
            fi
          done

          if [[ -z "$creds_source" ]]; then
            echo "Missing credential file for runner ADC bootstrap." >&2
            exit 1
          fi

          adc_dir="${HOME}/.config/gcloud"
          adc_path="${adc_dir}/application_default_credentials.json"
          mkdir -p "$adc_dir"
          cp "$creds_source" "$adc_path"
          chmod 600 "$adc_path"

          # The deploy scripts intentionally scrub credential-file env vars before
          # invoking the guarded prod entrypoints. Seeding the well-known ADC path
          # keeps runner-side Python preflight checks authenticated without relaxing
          # the runtime env validation.
          gcloud auth application-default print-access-token >/dev/null

      - name: Install Firebase CLI
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_COMPONENT" != "frontend" && "$DEPLOY_COMPONENT" != "all" && "$DEPLOY_COMPONENT" != "backend" && "$DEPLOY_COMPONENT" != "detectors" && "$DEPLOY_COMPONENT" != "workers" ]]; then
            echo "Unexpected deploy component: ${DEPLOY_COMPONENT}" >&2
            exit 1
          fi
          if [[ "$DEPLOY_COMPONENT" != "frontend" && "$DEPLOY_COMPONENT" != "all" ]]; then
            echo "Firebase CLI is not required for component=${DEPLOY_COMPONENT}."
            exit 0
          fi
          npm install --global firebase-tools

      - name: Materialize backend env file
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/backend.env"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run does not materialize backend env files."
            exit 0
          fi
          if [[ "$DEPLOY_COMPONENT" == "frontend" ]]; then
            echo "Backend env file is not required for component=${DEPLOY_COMPONENT}."
            exit 0
          fi
          if [[ -z "$DEPLOY_BACKEND_ENV_B64" ]]; then
            echo "Missing backend env secret for environment=${DEPLOY_ENVIRONMENT}." >&2
            exit 1
          fi
          printf '%s' "$DEPLOY_BACKEND_ENV_B64" | base64 --decode > "$RUNNER_TEMP/backend.env"

      - name: Materialize frontend override env file
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/frontend.env"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run does not materialize frontend override env files."
            exit 0
          fi
          if [[ "$DEPLOY_COMPONENT" != "frontend" && "$DEPLOY_COMPONENT" != "all" ]]; then
            echo "Frontend override env file is not required for component=${DEPLOY_COMPONENT}."
            exit 0
          fi
          if [[ -z "$DEPLOY_FRONTEND_OVERRIDE_B64" ]]; then
            if [[ "$DEPLOY_ENVIRONMENT" == "prod" ]]; then
              echo "Missing prod frontend override env secret." >&2
              exit 1
            fi
            echo "No dev frontend override env file configured; using committed stack defaults."
            exit 0
          fi
          printf '%s' "$DEPLOY_FRONTEND_OVERRIDE_B64" | base64 --decode > "$RUNNER_TEMP/frontend.env"

      - name: Acquire shared production Hosting deployment lock
        if: >-
          ${{
            needs.resolve.outputs.deploy_environment == 'prod'
            && needs.resolve.outputs.dry_run != 'true'
            && (
              needs.resolve.outputs.component == 'frontend'
              || needs.resolve.outputs.component == 'all'
            )
          }}
        run: |
          set -euo pipefail
          lock_owner="controlled-deploy:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          lock_state="$RUNNER_TEMP/form-catalog-production-lock.json"
          bash scripts/form-catalog-production-lock.sh \
            --action acquire \
            --bucket gs://dullypdf-form-catalog-assets-east4 \
            --project dullypdf \
            --owner "$lock_owner" \
            --state-file "$lock_state"
          {
            echo "FORM_CATALOG_PRODUCTION_LOCK_OWNER=$lock_owner"
            echo "FORM_CATALOG_PRODUCTION_LOCK_STATE_PATH=$lock_state"
          } >> "$GITHUB_ENV"

      - name: Verify committed active form catalog mapping
        if: >-
          ${{
            needs.resolve.outputs.deploy_environment == 'prod'
            && needs.resolve.outputs.dry_run != 'true'
            && (
              needs.resolve.outputs.component == 'frontend'
              || needs.resolve.outputs.component == 'all'
            )
          }}
        run: |
          set -euo pipefail
          active_path="form_catalog_releases/active.json"
          data_path="frontend/src/config/formCatalogData.mjs"
          evidence_path="$RUNNER_TEMP/form-catalog-active-mapping.json"
          manifest_path="$RUNNER_TEMP/form-catalog-release-manifest.json"
          release_id="$(jq -r '.releaseId // empty' "$active_path")"
          replacement_count="$(jq -r '.replacements | length' "$active_path")"
          args=(
            --active-release "$active_path"
            --form-catalog-data "$data_path"
            --repo-root .
            --output "$evidence_path"
          )
          rm -f "$manifest_path"
          if [[ -n "$release_id" || "$replacement_count" != "0" ]]; then
            if [[ -z "$release_id" || "$replacement_count" == "0" ]]; then
              echo "Active catalog metadata and replacements are inconsistent." >&2
              exit 1
            fi
            gcloud storage cp \
              "gs://dullypdf-form-catalog-assets-east4/releases/${release_id}/release-manifest.json" \
              "$manifest_path" \
              --project dullypdf
            args+=(--manifest "$manifest_path")
          fi
          python3 -m scripts.form_catalog_factory verify-active-mapping "${args[@]}"
          cp -- "$active_path" "$RUNNER_TEMP/form-catalog-active.json"
          cp -- "$data_path" "$RUNNER_TEMP/form-catalog-data.mjs"
          {
            echo "FORM_CATALOG_REQUIRE_ACTIVE_MAPPING=1"
            echo "FORM_CATALOG_ACTIVE_MAPPING_EVIDENCE_PATH=$evidence_path"
            echo "FORM_CATALOG_RELEASE_MANIFEST_PATH=$manifest_path"
          } >> "$GITHUB_ENV"

      - name: Capture pre-deploy form catalog Hosting version
        id: form_catalog_release
        if: >-
          ${{
            needs.resolve.outputs.deploy_environment == 'prod'
            && needs.resolve.outputs.dry_run != 'true'
            && (
              needs.resolve.outputs.component == 'frontend'
              || needs.resolve.outputs.component == 'all'
            )
          }}
        run: |
          set -euo pipefail
          release_id="$(jq -r '.releaseId // empty' form_catalog_releases/active.json)"
          replacement_count="$(jq -r '.replacements | length' form_catalog_releases/active.json)"
          if [[ -z "$release_id" || "$replacement_count" == "0" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "No active immutable catalog release; Hosting evidence is not required."
            exit 0
          fi

          before_path="$RUNNER_TEMP/form-catalog-hosting-before.json"
          deploy_result_path="$RUNNER_TEMP/firebase-hosting-deploy-result.json"
          evidence_path="$RUNNER_TEMP/form-catalog-hosting-evidence.json"
          rollback_path="$RUNNER_TEMP/form-catalog-hosting-rollback.json"
          python3 -m scripts.form_catalog_factory snapshot-hosting \
            --project dullypdf \
            --site dullypdf \
            --output "$before_path"
          {
            echo "active=true"
            echo "release_id=$release_id"
          } >> "$GITHUB_OUTPUT"
          {
            echo "FORM_CATALOG_HOSTING_BEFORE_PATH=$before_path"
            echo "FIREBASE_HOSTING_DEPLOY_RESULT_PATH=$deploy_result_path"
            echo "FORM_CATALOG_HOSTING_EVIDENCE_PATH=$evidence_path"
            echo "FORM_CATALOG_HOSTING_ROLLBACK_PATH=$rollback_path"
            echo "FORM_CATALOG_CREATE_HOSTING_EVIDENCE=1"
          } >> "$GITHUB_ENV"

      - name: Run deploy target
        run: |
          set -euo pipefail

          restore_var() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              export "${name}=${value}"
            else
              unset "${name}"
            fi
          }

          args=(
            --environment "$DEPLOY_ENVIRONMENT"
            --component "$DEPLOY_COMPONENT"
          )
          if [[ -f "$RUNNER_TEMP/backend.env" ]]; then
            args+=(--backend-env-file "$RUNNER_TEMP/backend.env")
          fi
          if [[ -f "$RUNNER_TEMP/frontend.env" ]]; then
            args+=(--frontend-env-file "$RUNNER_TEMP/frontend.env")
          fi
          if [[ -n "$BACKEND_IMAGE" ]]; then
            args+=(--backend-image "$BACKEND_IMAGE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi

          saved_google_application_credentials="${GOOGLE_APPLICATION_CREDENTIALS-}"
          saved_cloudsdk_auth_credential_file_override="${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE-}"
          saved_google_gha_creds_path="${GOOGLE_GHA_CREDS_PATH-}"

          if [[ "$DEPLOY_COMPONENT" == "frontend" ]]; then
            bash scripts/ci/deploy_target.sh "${args[@]}"
            exit 0
          fi

          # Prod backend-style deploy scripts reject credential-file env injection
          # and expect the authenticated gcloud session to stand on its own. Keep
          # those guards for backend, detectors, workers, and all-in-one deploys,
          # but allow frontend-only deploys to use the credential file that
          # Firebase Hosting expects in GitHub Actions.
          unset GOOGLE_APPLICATION_CREDENTIALS CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE GOOGLE_GHA_CREDS_PATH
          bash scripts/ci/deploy_target.sh "${args[@]}"
          restore_var GOOGLE_APPLICATION_CREDENTIALS "${saved_google_application_credentials}"
          restore_var CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE "${saved_cloudsdk_auth_credential_file_override}"
          restore_var GOOGLE_GHA_CREDS_PATH "${saved_google_gha_creds_path}"

      - name: Install Chromium for Playwright deploy smoke
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" || "$DEPLOY_COMPONENT" != "frontend" && "$DEPLOY_COMPONENT" != "all" ]]; then
            echo "Hosted Playwright smoke is not required for component=${DEPLOY_COMPONENT}."
            exit 0
          fi
          npx playwright install --with-deps chromium

      - name: Run deployed frontend Playwright smoke
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" || "$DEPLOY_COMPONENT" != "frontend" && "$DEPLOY_COMPONENT" != "all" ]]; then
            echo "Hosted Playwright smoke is not required for component=${DEPLOY_COMPONENT}."
            exit 0
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == "prod" ]]; then
            base_url="https://dullypdf.web.app"
          else
            base_url="https://dullypdf-dev.web.app"
          fi

          check_api_health="false"
          if [[ "$DEPLOY_COMPONENT" == "all" ]]; then
            check_api_health="true"
          fi

          PLAYWRIGHT_BASE_URL="$base_url" \
          PLAYWRIGHT_API_URL="$base_url" \
          PLAYWRIGHT_CHECK_API_HEALTH="$check_api_health" \
          npm run test:playwright:deployed-frontend:real

      - name: Verify immediate form catalog Hosting evidence
        if: ${{ steps.form_catalog_release.outputs.active == 'true' }}
        run: |
          set -euo pipefail
          test -s "$FORM_CATALOG_HOSTING_EVIDENCE_PATH"
          jq -e '
            .schemaVersion == 1
            and .reportType == "form-catalog-hosting-deployment"
            and .producer == "controlled-deploy"
            and .environment == "production"
            and .projectId == "dullypdf"
            and .site == "dullypdf"
            and .ok == true
          ' "$FORM_CATALOG_HOSTING_EVIDENCE_PATH" >/dev/null

      - name: Roll back failed form catalog Hosting deployment
        if: >-
          ${{
            always()
            && steps.form_catalog_release.outputs.active == 'true'
            && (failure() || cancelled())
          }}
        run: |
          set -euo pipefail
          lock_state="$RUNNER_TEMP/form-catalog-production-lock.json"
          lock_owner="controlled-deploy:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          rollback_path="$FORM_CATALOG_HOSTING_ROLLBACK_PATH"
          current_path="$RUNNER_TEMP/form-catalog-hosting-failure-current.json"
          diagnostic_path="$RUNNER_TEMP/form-catalog-hosting-failure-diagnostic.json"

          if [[ ! -s "$FORM_CATALOG_HOSTING_EVIDENCE_PATH" \
            && -s "$FIREBASE_HOSTING_DEPLOY_RESULT_PATH" ]]; then
            if ! python3 -m scripts.form_catalog_factory create-hosting-evidence \
              --active-release form_catalog_releases/active.json \
              --active-mapping-evidence "$FORM_CATALOG_ACTIVE_MAPPING_EVIDENCE_PATH" \
              --form-catalog-data frontend/src/config/formCatalogData.mjs \
              --release-manifest "$FORM_CATALOG_RELEASE_MANIFEST_PATH" \
              --before-snapshot "$FORM_CATALOG_HOSTING_BEFORE_PATH" \
              --deploy-result "$FIREBASE_HOSTING_DEPLOY_RESULT_PATH" \
              --project dullypdf \
              --site dullypdf \
              --site-origin https://dullypdf.com \
              --site-origin https://dullypdf.web.app \
              --deployment-commit "$GITHUB_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --output "$FORM_CATALOG_HOSTING_EVIDENCE_PATH"; then
              echo "The original Firebase result could not produce exact Hosting evidence; classifying live state without authorizing rollback." >&2
            fi
          fi

          if [[ ! -s "$FORM_CATALOG_HOSTING_EVIDENCE_PATH" ]]; then
            python3 -m scripts.form_catalog_factory snapshot-hosting \
              --project dullypdf \
              --site dullypdf \
              --output "$current_path"
            before_version="$(jq -r '.hostingVersion' "$FORM_CATALOG_HOSTING_BEFORE_PATH")"
            current_version="$(jq -r '.hostingVersion' "$current_path")"
            generation="$(jq -r '.generation // empty' "$lock_state")"
            jq -n \
              --arg releaseId "${{ steps.form_catalog_release.outputs.release_id }}" \
              --arg beforeHostingVersion "$before_version" \
              --arg currentHostingVersion "$current_version" \
              --arg lockOwner "$lock_owner" \
              --arg lockGeneration "$generation" \
              --argjson hostingUnchanged "$([[ "$current_version" == "$before_version" ]] && echo true || echo false)" \
              '{
                schemaVersion: 1,
                reportType: "form-catalog-hosting-failure-diagnostic",
                producer: "controlled-deploy-failure-gate",
                environment: "production",
                releaseId: $releaseId,
                beforeHostingVersion: $beforeHostingVersion,
                currentHostingVersion: $currentHostingVersion,
                hostingUnchanged: $hostingUnchanged,
                productionLockOwner: $lockOwner,
                productionLockGeneration: $lockGeneration,
                rollbackAuthorized: false,
                ok: $hostingUnchanged
              }' > "$diagnostic_path"
            if [[ "$current_version" == "$before_version" ]]; then
              echo "The failed workflow did not change live Hosting; no rollback release was needed."
              exit 0
            fi
            echo "Live Hosting differs from the pre-deploy version, but the original Firebase deploy result cannot prove the target. Automatic rollback is forbidden." >&2
            exit 1
          fi

          generation="$(jq -r '.generation // empty' "$lock_state")"
          if [[ -z "$generation" ]]; then
            echo "Production lock state has no generation; rollback is forbidden." >&2
            exit 1
          fi
          rollback_args=(
            --hosting-evidence "$FORM_CATALOG_HOSTING_EVIDENCE_PATH"
            --pointer-object-url "gs://dullypdf-form-catalog-assets-east4/catalog-release-state/active.json"
            --lock-owner "$lock_owner"
            --lock-generation "$generation"
            --lock-state-file "$lock_state"
            --trigger-stage "controlled-deploy-post-live"
            --trigger-exit-code 1
            --output "$rollback_path"
          )
          previous_release_id="$(jq -r '.previousReleaseId // empty' form_catalog_releases/active.json)"
          if [[ -n "$previous_release_id" ]]; then
            rollback_args+=(--previous-release-id "$previous_release_id")
          fi
          python3 -m scripts.form_catalog_factory rollback-hosting \
            "${rollback_args[@]}"

      - name: Upload form catalog Hosting evidence
        id: form_catalog_evidence_upload
        if: ${{ always() && steps.form_catalog_release.outputs.active == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: form-catalog-hosting-evidence-${{ steps.form_catalog_release.outputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/form-catalog-hosting-before.json
            ${{ runner.temp }}/firebase-hosting-deploy-result.json
            ${{ runner.temp }}/form-catalog-active-mapping.json
            ${{ runner.temp }}/form-catalog-active.json
            ${{ runner.temp }}/form-catalog-data.mjs
            ${{ runner.temp }}/form-catalog-release-manifest.json
            ${{ runner.temp }}/form-catalog-hosting-evidence.json
            ${{ runner.temp }}/form-catalog-hosting-rollback.json
            ${{ runner.temp }}/form-catalog-hosting-failure-current.json
            ${{ runner.temp }}/form-catalog-hosting-failure-diagnostic.json
            ${{ runner.temp }}/form-catalog-production-lock.json
          if-no-files-found: error
          retention-days: 90

      - name: Roll back when form catalog evidence upload fails
        if: >-
          ${{
            always()
            && steps.form_catalog_release.outputs.active == 'true'
            && steps.form_catalog_evidence_upload.outcome == 'failure'
          }}
        run: |
          set -euo pipefail
          rollback_path="$FORM_CATALOG_HOSTING_ROLLBACK_PATH"
          diagnostic_path="$RUNNER_TEMP/form-catalog-hosting-failure-diagnostic.json"
          if [[ -s "$rollback_path" ]] && jq -e '
            .reportType == "form-catalog-hosting-rollback"
            and .producer == "locked-post-live-gate"
            and .pointerUnchanged == true
            and .ok == true
          ' "$rollback_path" >/dev/null; then
            echo "Hosting was already rolled back before the failed upload."
            exit 0
          fi
          if [[ -s "$diagnostic_path" ]] && jq -e '
            .reportType == "form-catalog-hosting-failure-diagnostic"
            and .hostingUnchanged == true
            and .rollbackAuthorized == false
            and .ok == true
          ' "$diagnostic_path" >/dev/null; then
            echo "The failed run never changed Hosting."
            exit 0
          fi
          if [[ ! -s "$FORM_CATALOG_HOSTING_EVIDENCE_PATH" ]]; then
            echo "Evidence upload failed and no exact Hosting receipt exists. Automatic rollback is forbidden." >&2
            exit 1
          fi
          lock_state="$RUNNER_TEMP/form-catalog-production-lock.json"
          lock_owner="controlled-deploy:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          generation="$(jq -r '.generation // empty' "$lock_state")"
          if [[ -z "$generation" ]]; then
            echo "Production lock state has no generation; rollback is forbidden." >&2
            exit 1
          fi
          rollback_args=(
            --hosting-evidence "$FORM_CATALOG_HOSTING_EVIDENCE_PATH"
            --pointer-object-url "gs://dullypdf-form-catalog-assets-east4/catalog-release-state/active.json"
            --lock-owner "$lock_owner"
            --lock-generation "$generation"
            --lock-state-file "$lock_state"
            --trigger-stage "controlled-deploy-evidence-upload"
            --trigger-exit-code 1
            --output "$rollback_path"
          )
          previous_release_id="$(jq -r '.previousReleaseId // empty' form_catalog_releases/active.json)"
          if [[ -n "$previous_release_id" ]]; then
            rollback_args+=(--previous-release-id "$previous_release_id")
          fi
          python3 -m scripts.form_catalog_factory rollback-hosting \
            "${rollback_args[@]}"

      - name: Preserve form catalog upload-failure recovery evidence
        id: form_catalog_recovery_upload
        if: >-
          ${{
            always()
            && steps.form_catalog_release.outputs.active == 'true'
            && steps.form_catalog_evidence_upload.outcome == 'failure'
          }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: form-catalog-hosting-recovery-${{ steps.form_catalog_release.outputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/form-catalog-hosting-before.json
            ${{ runner.temp }}/firebase-hosting-deploy-result.json
            ${{ runner.temp }}/form-catalog-active-mapping.json
            ${{ runner.temp }}/form-catalog-active.json
            ${{ runner.temp }}/form-catalog-data.mjs
            ${{ runner.temp }}/form-catalog-release-manifest.json
            ${{ runner.temp }}/form-catalog-hosting-evidence.json
            ${{ runner.temp }}/form-catalog-hosting-rollback.json
            ${{ runner.temp }}/form-catalog-hosting-failure-current.json
            ${{ runner.temp }}/form-catalog-hosting-failure-diagnostic.json
            ${{ runner.temp }}/form-catalog-production-lock.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail when form catalog evidence upload failed
        if: >-
          ${{
            always()
            && steps.form_catalog_evidence_upload.outcome == 'failure'
          }}
        run: |
          echo "Form catalog Hosting evidence upload failed; the deployment was not retained." >&2
          exit 1

      - name: Release shared production Hosting deployment lock
        if: >-
          ${{
            always()
            && needs.resolve.outputs.deploy_environment == 'prod'
            && needs.resolve.outputs.dry_run != 'true'
            && (
              needs.resolve.outputs.component == 'frontend'
              || needs.resolve.outputs.component == 'all'
            )
          }}
        # Status functions are restricted to `if`; pass the supported job
        # context into the cleanup shell so lock release remains fail-closed.
        env:
          FORM_CATALOG_TERMINAL_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/form-catalog-production-lock.json"
          if [[ ! -f "$state_file" ]]; then
            echo "No production Hosting lock state exists; nothing to release."
            exit 0
          fi
          case "$FORM_CATALOG_TERMINAL_JOB_STATUS" in
            success)
              deployment_failed=false
              ;;
            failure|cancelled)
              deployment_failed=true
              ;;
            *)
              echo "Unknown terminal job status; retaining the production lock lease for manual repair." >&2
              exit 1
              ;;
          esac
          if [[ "${{ steps.form_catalog_release.outputs.active }}" == "true" \
            && "$deployment_failed" == "true" ]]; then
            rollback_path="$FORM_CATALOG_HOSTING_ROLLBACK_PATH"
            diagnostic_path="$RUNNER_TEMP/form-catalog-hosting-failure-diagnostic.json"
            lock_owner="controlled-deploy:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            release_id="${{ steps.form_catalog_release.outputs.release_id }}"
            if [[ "${{ steps.form_catalog_evidence_upload.outcome }}" == "failure" \
              && "${{ steps.form_catalog_recovery_upload.outcome }}" != "success" ]]; then
              echo "Neither evidence upload preserved the terminal Hosting state. Retaining the production lock lease for manual repair." >&2
              exit 1
            fi
            if [[ -s "$rollback_path" ]] && jq -e \
              --arg lockOwner "$lock_owner" \
              --arg releaseId "$release_id" '
              .schemaVersion == 1
              and .reportType == "form-catalog-hosting-rollback"
              and .producer == "locked-post-live-gate"
              and .environment == "production"
              and .releaseId == $releaseId
              and .productionLockOwner == $lockOwner
              and .pointerUnchanged == true
              and .ok == true
            ' "$rollback_path" >/dev/null; then
              echo "Verified canonical Hosting rollback receipt before lock release."
            elif [[ -s "$diagnostic_path" ]] && jq -e \
              --arg lockOwner "$lock_owner" \
              --arg releaseId "$release_id" '
              .schemaVersion == 1
              and .reportType == "form-catalog-hosting-failure-diagnostic"
              and .producer == "controlled-deploy-failure-gate"
              and .environment == "production"
              and .releaseId == $releaseId
              and .productionLockOwner == $lockOwner
              and .hostingUnchanged == true
              and .rollbackAuthorized == false
              and .ok == true
            ' "$diagnostic_path" >/dev/null; then
              echo "Verified that the failed run never changed Hosting."
            else
              echo "No verified terminal Hosting state exists. Retaining the production lock lease for manual repair." >&2
              exit 1
            fi
          fi
          bash scripts/form-catalog-production-lock.sh \
            --action release \
            --bucket gs://dullypdf-form-catalog-assets-east4 \
            --project dullypdf \
            --owner "controlled-deploy:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --state-file "$state_file"
